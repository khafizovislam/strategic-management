[project]
name = "carpulse"
version = "0.1.0"
description = "CarPulse: check your car's health with a 5-minute drive through an OBD adapter."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["flet==1.1.3"]

[project.optional-dependencies]
dev = ["flet[all]==1.1.3", "pytest>=8"]

# Settings used by `flet build ipa` (iPhone) and `flet build apk` (Android).
[tool.flet]
org = "com.carpulse"
product = "CarPulse"
company = "CarPulse"
copyright = "Copyright (C) 2026 CarPulse"

[tool.flet.app]
path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
